<!DOCTYPE html>
<html>
  <head>
    <title>Nested Flexbox</title>

    <style>
      .l13a{
        display: flex;
        height: 50px;
      }

      .pink{
        background-color: lightpink;
        width: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .blue{
        background-color: lightblue;
        width: 200px;
      }

      .black{
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="l13a">
      <div class="pink">
        <div class="black">item1</div>
      </div>
      <div class="blue"></div>
    </div>
  </body>
</html>
