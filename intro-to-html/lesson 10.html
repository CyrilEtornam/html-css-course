<!DOCTYPE html>
<html>
    <head>
        <title>Lesson 10</title>

        <style>
            p{
                font-family: roboto;
            }
            .friend-request{
                width: 150px;
                border: 1px solid rgb(151, 151, 151);
                border-radius: 5px;
                display: inline-block;
                margin-left: 12px;
                /* box-shadow: 4px 4px 4px rgba(0,0,0, .25), -4px -4px -4px rgba(0,0,0, .25); */
                box-shadow: 4px 4px 4px rgba(0,0,0, .15), -4px -4px 4px rgba(0,0,0, .15);
                margin-bottom: 100px;
            }

            .name{
                font-weight: bold;
                font-size: 20px;
                margin-bottom: 0px;
                margin-top: 5px;
                margin-left: 7px;
            }

            .mutual-friends{
                margin-top: 3px;
                margin-bottom: 8px;
                margin-left: 7px;
                color: rgb(151, 151, 151);
            }

            .profile-pic{
                width: 150px;
                height: 160px;
                object-fit: cover;

            }

            .add-friend{
                background-color: rgb(43, 99, 187);
                color: white;
                width: 105px;
                height: 38px;
                font-size: 15px;
                font-weight: lighter;
                text-align: center;
                border: none;
                border-radius: 5px;
                padding-top: 5px;
                padding-bottom: 5px;
                padding-left: 15px;
                padding-right: 15px;
                cursor: pointer;
                margin-bottom: 7px;
                margin-left: 7px;
            }

            .add-friend:active{
                background-color: rgb(10, 62, 160);
            }
        </style>
    </head>
    <body>
        <div div1>
            <div class="friend-request">
                <div>
                    <img class="profile-pic" src="images/cat1.jpg" alt="">
                </div>
                <div>
                    <p class="name">Cyril</p>
                </div>         
            
                <p class="mutual-friends">
                    2 mutual friends
                </p>
            
                <button class="add-friend">Add Friend</button>
            </div>
            
            <div class="friend-request">
                <img class="profile-pic" src="images/cat2.jpg" alt="">
                <p class="name">
                    Etornam
                </p>
            
                <p class="mutual-friends">
                    3 mutual friends
                </p>
            
                <button class="add-friend">Add Friend</button>
            </div>
            
            
            <div class="friend-request">
                <img class="profile-pic" src="images/cat3.jpg" alt="">
                <p class="name">
                    Shampoo
                </p>
            
                <p class="mutual-friends">
                    4 mutual friends
                </p>
            
                <button class="add-friend">Add Friend</button>
            </div>
        </div>
    </body>
</html>
