<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <style>
      p{
        font-family: roboto;
      }
      .grid1{
        display: grid;
        grid-template-columns: 200px 75px;
        margin-bottom: 50px;
      }

      .grid2{
        display: grid;
        grid-template-columns: 50px 1fr 75px;
        margin-bottom: 50px;
      }

      .grid3{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        column-gap: 15px;
        row-gap: 9px;
        margin-bottom: 50px;
      }

      .grid4{
        display: grid;
        grid-template-columns: 150px 150px 150px;
        column-gap: 30px;
      }

      .friend-request{
        border: 1px solid rgb(151, 151, 151);
        box-shadow: 4px 4px 4px rgba(0,0,0, .15), -4px -4px 4px rgba(0,0,0, .15);
        margin-bottom: 100px;
      }

      .name{
        font-weight: bold;
        font-size: 20px;
        margin-bottom: 0px;
        margin-top: 5px;
        margin-left: 7px;
      }

      .mutual-friends{
        margin-top: 3px;
        margin-bottom: 8px;
        margin-left: 7px;
        color: rgb(151, 151, 151);
      }

      .profile-pic{
        width: 100%;
        height: 160px;
        object-fit: cover;
      }

      .add-friend{
        background-color: rgb(43, 99, 187);
        color: white;
        /* width: 105px; */
        height: 38px;
        font-size: 15px;
        font-weight: lighter;
        text-align: center;
        border: none;
        border-radius: 5px;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 15px;
        padding-right: 15px;
        cursor: pointer;
        margin-bottom: 7px;
        margin-left: 7px;
      }

      .add-friend:active{
        background-color: rgb(10, 62, 160);
      }
    </style>
  </head>
  <body>
    <div class="grid1">
      <div style="background-color: 
      lightblue;">200px</div >

      <div style="background-color: 
      lightpink;">75px</div>
    </div>


    <div class="grid2">
      <div style="background-color: 
      lightblue;">col1</div>

      <div style="background-color: 
      lightpink;">col2</div>

      <div style="background-color: 
      lightblue;">col3</div>
    </div>


    <div class="grid3">
      <div style="background-color: 
      lightpink;">col1</div>
      <div style="background-color: 
      lightpink;">col2</div>
      <div style="background-color: 
      lightpink;">col3</div>
      <div style="background-color: 
      lightpink;">col4</div>
      <div style="background-color: 
      lightpink;">col1</div>
      <div style="background-color: 
      lightpink;">col2</div>
      <div style="background-color: 
      lightpink;">col3</div>
      <div style="background-color: 
      lightpink;">col4</div>
    </div>


    <div class="grid4">
      <div class="friend-request">
        <img class="profile-pic" src="images/cat1.jpg" alt="">
        <p class="name">
            Cyril
        </p>

        <p class="mutual-friends">
            2 mutual friends
        </p>

        <button class="add-friend">Add Friend</button>
    </div>


    <div class="friend-request">
        <img class="profile-pic" src="images/cat2.jpg" alt="">
        <p class="name">
            Etornam
        </p>

        <p class="mutual-friends">
            3 mutual friends
        </p>

        <button class="add-friend">Add Friend</button>
    </div>


    <div class="friend-request">
        <img class="profile-pic" src="images/cat3.jpg" alt="">
        <p class="name">
            Shampoo
        </p>

        <p class="mutual-friends">
            4 mutual friends
        </p>

        <button class="add-friend">Add Friend</button>
    </div>
    </div>
  </body>
</html>
