<!DOCTYPE html>
<html>
  <head>
    <title>Position exercise</title>
    <style>
      body{
        height: 3000px;
        font-family: roboto;
        background-image: thumbnail-4.webp;
      }

      p{
        margin-top: 14px;
        margin-bottom: 0;
      }

      .sidebar{
        position: fixed;
        background-color: green;
        color: white;
        top: 0;
        bottom: 0;
        right: 0;
        width: 100px;
      }

      .overlay{
        position: fixed;
        top: 0;
        bottom:0;
        left:0;
        right: 0;
        background-color: rgba(0,0,0,0.6);

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal{
        background-color: white;
        width: 400px;
        height: 130px;
        padding-left: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        border-radius: 5px;
      }

      .line1{
        font-weight: bold;
        font-size: 30px;
      }

      .line2{
        font-size:20px;
        margin-bottom: 13px;
      }

      .close-button{
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">right sidebar</div>

    <div class="overlay">
      <div class="modal">
        <p class="line1">Modal Title</p>
        <p class="line2">This is a modal</p>
        <button class="close-button">Close</button>
      </div>
    </div>
  </body>
</html>
